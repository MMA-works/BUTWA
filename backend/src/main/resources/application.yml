server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: batwa-wallet-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./batwa_data;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # 🔐 SECURITY: Set JWT_SECRET env var before starting — minimum 64 hex chars
    # Generate with: openssl rand -hex 64
    # NEVER hardcode this value here.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  wallet:
    default-currency: USD
    transfer-fee-percentage: 0.005
    max-daily-transfer: 50000.00
    max-pin-attempts: 3
