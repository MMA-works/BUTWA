[build]
  publish = "website"

[[redirects]]
  from = "/batwa-wallet.apk"
  to = "https://github.com/MMA-works/BUTWA/releases/download/v2.2.0/batwa-wallet.apk"
  status = 302
  force = true

[[redirects]]
  from = "/download/apk"
  to = "https://github.com/MMA-works/BUTWA/releases/download/v2.2.0/batwa-wallet.apk"
  status = 302
  force = true

[[headers]]
  for = "/batwa-wallet.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"batwa-wallet.apk\""

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
