name: batwa_wallet
description: "BATWA - High Security Production Cross-Platform E-Wallet"
publish_to: 'none'
version: 2.4.14+254

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  
  # Networking & HTTP
  dio: ^5.4.2+1
  uuid: ^4.3.3
  
  # Local Storage & Session Cache
  shared_preferences: ^2.2.2
  
  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  
  # UI & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/banks/
    - assets/images/payment_networks/

