<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — BATWA Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="/app_logo.png" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-center px-4 py-16">

  <div class="max-w-sm w-full space-y-8">

    <!-- Icon -->
    <div class="relative mx-auto w-24 h-24">
      <div class="w-24 h-24 rounded-full bg-[#063A27] flex items-center justify-center shadow-2xl">
        <svg class="w-12 h-12 text-[#10B981]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <!-- Ping dot -->
      <span class="absolute top-1 right-1 flex h-4 w-4">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#10B981] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-4 w-4 bg-[#10B981]"></span>
      </span>
    </div>

    <!-- Error code -->
    <div>
      <p class="text-7xl font-black text-[#063A27] tracking-tighter">404</p>
      <h1 class="mt-2 text-xl font-bold text-[#0F172A]">Page Not Found</h1>
      <p class="mt-3 text-sm text-[#64748B] font-medium leading-relaxed">
        This page doesn't exist or was moved.<br/>
        Your money and account are perfectly safe — you just took a wrong turn.
      </p>
    </div>

    <!-- Security badge -->
    <div class="mx-auto inline-flex items-center gap-2 bg-[#063A27]/8 border border-[#10B981]/20 rounded-full px-4 py-1.5">
      <div class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></div>
      <span class="text-xs font-bold text-[#047857]">Your wallet is secure & active</span>
    </div>

    <!-- CTA -->
    <div class="flex flex-col gap-3">
      <a href="/"
         class="w-full bg-[#063A27] hover:bg-black text-[#10B981] font-black text-sm py-4 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to BATWA Home
      </a>
      <a href="mailto:support@battwaa.online"
         class="w-full bg-white hover:bg-gray-50 text-[#0F172A] font-bold text-sm py-3.5 rounded-2xl border border-black/8 shadow-sm transition flex items-center justify-center gap-2">
        Contact Support
      </a>
    </div>

    <!-- Footer -->
    <p class="text-xs text-[#94A3B8] font-medium pt-2">
      BATWA Financial Technologies · <a href="https://battwaa.online" class="hover:text-[#10B981] transition">battwaa.online</a>
    </p>
  </div>

</body>
</html>
